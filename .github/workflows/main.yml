name: Auto Scrape & Paraphrase News + 5s Video Preview

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-update-lock
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies (FFmpeg & Playwright)
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install feedparser requests beautifulsoup4 playwright
          playwright install chromium

      - name: Run News Scraper & 5s Video Preview
        run: |
          if [ -f "import_v4_video.py" ]; then
            python import_v4_video.py
          elif [ -f "import_v4.py" ]; then
            python import_v4.py
          else
            python import.py
          fi

      - name: Commit & Push Updated Files
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Cek status file yang berubah sebelum di-add
          git status

          # Paksa tambahkan seluruh file, folder artikel, dan folder videos
          git add -A

          git status

          if ! git diff --staged --quiet; then
            git commit -m "Auto update news, HTML, sitemap, RSS & 5s video preview"
            git pull --rebase -X ours --autostash origin main || true
            git push origin main
          else
            echo "Tidak ada file baru atau perubahan untuk di-push."
          fi
Berikut ringkasan perubahan yang ditambahkan dari file asli Anda:

timeout-minutes: 35 & cache: 'pip': Mencegah job berhenti mendadak saat proses scraping dan perekaman video berjalan lebih lama, sekaligus mempercepat instalasi paket Python.

Instalasi ffmpeg & playwright chromium: Menyiapkan browser headless dan encoder video agar perekaman preview sumber 5 detik bisa berjalan di runner Ubuntu.

Pengecekan skrip otomatis (import_v4_video.py -> import_v4.py -> import.py): Menjalankan skrip yang tersedia di repo secara berurutan tanpa perlu mengedit workflow jika nama file skrip berganti.

Kompatibilitas git add -A & git pull --rebase -X ours --autostash: Mempertahankan alur commit dan push Anda sambil memastikan file HTML, database, sitemap, RSS, maupun video hasil generate ikut terdorong ke origin main.

